services:
  - type: web
    name: web-timer
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Render 대시보드에서 다음 환경변수들을 추가하세요:
      # - AIRTABLE_API_KEY
      # - AIRTABLE_BASE_ID
      # - AIRTABLE_TABLE_NAME
      # - PORT (자동으로 설정됨)

